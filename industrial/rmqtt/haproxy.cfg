# HAProxy in front of the three RMQTT nodes (TCP mode).
#
#   :1883  MQTT      one endpoint for the devices and the gateways; a client keeps its node while the node is up
#                    (source address hash), so a persistent session finds its stored state again
#   :6060  HTTP API  and dashboard of RMQTT, load balanced
#
# The node names are resolved again every few seconds (a restarted container gets a new address).
global
    maxconn 100000
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 2h
    timeout server 2h
    option clitcpka
    option srvtcpka
    default-server inter 2s fall 3 rise 2 resolvers docker init-addr none

resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold nx 5s
    hold timeout 5s
    hold refused 5s
    hold obsolete 5s

frontend mqtt
    bind *:1883
    default_backend rmqtt_mqtt

backend rmqtt_mqtt
    balance source
    hash-type consistent
    server rmqtt1 rmqtt1:1883 check
    server rmqtt2 rmqtt2:1883 check
    server rmqtt3 rmqtt3:1883 check

frontend api
    bind *:6060
    default_backend rmqtt_api

backend rmqtt_api
    balance roundrobin
    server rmqtt1 rmqtt1:6060 check
    server rmqtt2 rmqtt2:6060 check
    server rmqtt3 rmqtt3:6060 check
