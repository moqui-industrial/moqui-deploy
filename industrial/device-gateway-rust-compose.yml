# Standalone Rust gateway for the existing industrial PostgreSQL/Artemis network.
# Set DEVICE_GATEWAY_CONTEXT to the checkout on branch mr-moqui before building.
# docker compose -f industrial/device-gateway-rust-compose.yml -p moqui up -d --build
services:
  moqui-device-gateway:
    build:
      context: ${DEVICE_GATEWAY_CONTEXT:?Set the absolute path to moqui-device-gateway on branch mr-moqui}
      dockerfile: Dockerfile
    image: ${DEVICE_GATEWAY_IMAGE:-moqui-device-gateway:rust-local}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:8081
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8081"
      GATEWAY_DEVICE_ID: ${GATEWAY_DEVICE_ID:-GW_EDGE_01}
      GATEWAY_API_AUTH_TOKEN: ${GATEWAY_API_AUTH_TOKEN:?Set a non-default gateway API token}
      DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgres://moqui:moqui@moqui-database:5432/moqui}
      LOG_DATABASE_URL: ${GATEWAY_LOG_DATABASE_URL:-postgres://moqui:moqui@moqui-database:5432/moqui}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://moqui-broker1:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-artemis}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-artemis}
      FILE_TRANSFER_URI: file:/deployments/data/recipes
    volumes:
      - device-gateway-rust-data:/deployments/data
      - device-gateway-rust-logs:/deployments/logs
    networks:
      - model
      - broker
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8081/q/health/ready]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
volumes:
  device-gateway-rust-data:
  device-gateway-rust-logs:
networks:
  model:
    external: true
    name: ${GATEWAY_MODEL_NETWORK:-moqui_default}
  broker:
    external: true
    name: ${GATEWAY_BROKER_NETWORK:-moqui-broker_brokernet}
