# Python for the agent skills: an MCP server of its own, with the latest Python and the libraries of the skills, on a network
# that has no way out. LibreChat joins that network as well (it keeps its own, with Internet) and reaches the server as
# http://moqui-python-skills:8000/mcp; nothing is published on the host.
#
# Start (after sync-librechat-skills.sh has filled librechat/skills):
#   docker compose -f python-skills-compose.yml -p ai up -d --build
#
# The writable workspace is ./librechat/skill-workspace on the host: inputs written by the model and the files a script makes.

services:
  moqui-python-skills:
    build: ./python-skills-mcp
    image: moqui-python-skills:latest
    container_name: moqui-python-skills
    restart: unless-stopped
    # the files of the workspace belong to the user of the host
    user: "1000:1000"
    networks:
      - skills_internal
    volumes:
      - ./librechat/skills:/skills:ro
      - ./librechat/skill-workspace:/workspace
      # documents of compliance projects, read only: the inbox the user fills (any size, never through the chat), the
      # staging uploads directory of LibreChat (fileStrategy: local), and the content store Moqui copies attached files
      # into (mantle.compliance.ContentServices.attach#Content)
      - ./compliance-inbox:/inbox:ro
      - ./librechat/uploads:/uploads:ro
      - ./compliance-content:/content:ro
    environment:
      - SKILLS_DIR=/skills
      - WORKSPACE_DIR=/workspace
      - INBOX_DIR=/inbox
      - UPLOADS_DIR=/uploads
      - CONTENT_DIR=/content
      - RUN_TIMEOUT_SECONDS=120
      - RUN_PYTHON_ENABLED=true
      - RUN_BASH_ENABLED=true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256

networks:
  skills_internal:
    name: moqui_skills_internal
    internal: true
