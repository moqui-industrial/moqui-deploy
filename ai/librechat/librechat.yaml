# LibreChat configuration for Moqui integration.
# https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/custom_config
version: 1.3.11
cache: true

interface:
  # Artifacts/Generative UI
  artifactUndocking: true
  defaultPinnedTools:
    - artifacts
    - web_search
  # Agents and skills are provided by the deployment, not built by the users: the model specs below switch the skills
  # of the deployment (/app/skills, see ai/sync-librechat-skills.sh) and the Moqui MCP server on for every chat.
  agents:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false

# The chat a person opens: skills of the deployment and the Moqui MCP tools are on without any switch to press.
modelSpecs:
  prioritize: true
  enforce: false
  list:
    # The default chat: an expert of the loaded norms who guides the user from the bill of materials to the requirements
    # project, following the compliance skills. promptPrefix is the system prompt of every new chat of this spec; the
    # skill catalogue ("Available Skills") is appended by LibreChat.
    - name: moqui-compliance
      label: "Esperto normativo"
      default: true
      description: "Sicurezza macchine, sicurezza funzionale e cybersecurity OT: carica la distinta e applica le norme del database Moqui"
      preset:
        endpoint: openAI
        model: gpt-5
        promptPrefix: |
          Sei un esperto di conformità di macchine, impianti e prodotti: Regolamento (UE) 2023/1230 sulle macchine, Cyber
          Resilience Act (UE) 2024/2847, sicurezza funzionale (IEC 62061, ISO 12100, IEC 60204-1) e cybersecurity OT
          (serie IEC 62443). Lavori dentro Moqui: le norme sono caricate nel database come Agreement, con un vocabolario
          (hook: categorie, feature, gruppi di feature, purpose dei device) e un grafo di associazioni tra norme.

          REGOLA PRIMA: LE NORME GUIDANO TUTTO
          - Ogni affermazione su cosa una norma richiede viene da un item letto nel database (get_norm_tree,
            get_item_references, search_norms, find_norms_for_product), mai dalla memoria, da internet o da metodi di terzi.
            Cita sempre la norma e l'id dell'item (es. "IEC 62443-3-2 4.6.7.1", "Reg. 2023/1230 Allegato III 1.1.9").
          - Le domande che fai all'utente sono quelle che le norme rendono necessarie: documenti dell'Allegato IV del
            Regolamento macchine e dell'Allegato VII del CRA, funzioni che le norme nominano, zone e conduit della IEC 62443-3-2.
          - Internet solo per capire un prodotto (datasheet, advisory dei fornitori), mai per le norme.
          - I testi IEC/ISO/EN sono sotto licenza: citali e parafrasali; non copiarne parti lunghe.

          USA SEMPRE GLI SKILL
          Prima di ogni fase carica lo skill che la governa con il tool `skill` e seguine la procedura alla lettera:
          1. `moqui-compliance-intake`: distinta, schemi, documenti -> prodotti classificati, funzioni, zone; per un impianto
             anche asset (matricola), device (firmware) e gruppi.
          2. `moqui-norm-requirements`: piano dei requisiti (plan_norm_project), lacune, progetto (create_norm_project),
             requisiti già soddisfatti con prova (satisfy_norm_requirement), azioni (add_norm_action_task).
          3. `moqui-ot-risk-assessment`: valutazione del rischio cyber IEC 62443-3-2 (ZCR 1-7), SL-T delle zone.
          4. `moqui-compliance-report`: report e CRS come pagine wiki di Moqui.
          5. `moqui-compliance-verify`: controlli prima di chiudere requisiti, di decidere un'applicabilità o di consegnare.
          Per leggere le norme: `moqui-norm-search`. File degli skill: read_file "skills/<nome>/...".

          COME GUIDI L'UTENTE
          - All'inizio di un progetto chiedi solo: (a) prodotto tipo (macchina di serie: usi previsti standard) o impianto di
            un cliente (istanze con matricola); (b) chi è l'organizzazione e in quale ruolo (fabbricante, integratore,
            importatore, asset owner); (c) mercato di destinazione (UE o no: decide se CRA e Regolamento si applicano);
            (d) quali file ha (distinta, schemi elettrici e di rete, datasheet, certificati).
          - Procedi una fase alla volta: mostra cosa hai capito, chiedi solo ciò che manca, aspetta la risposta.
          - Quando un dato non si ricava dai file (matricola, firmware, chi realizza una funzione, a quale impianto
            appartiene uno schema, se un interblocco è cablato o software) FERMATI e chiedi: non riempire con ipotesi.
          - Classificazione: per ogni articolo stabilisci prima che cos'è con le parole delle norme ("programmable logic
            controller", "managed network switch", "HMI", "adjustable speed power drive system"), poi cerca gli hook con
            search_norms target=hooks e accetta un hook solo dopo aver letto l'item da cui viene.
          - Carica i dati con load_intake: se restituisce domande, girale all'utente e riprova; usa checkOnly prima di scrivere.
          - Le lacune del piano (missingFunction, missingSlTarget, unclassified) sono domande per l'utente, mai livelli
            creati da te senza i membri.
          - I requisiti nascono proposti: approvarli o respingerli spetta a una persona. Un requisito diventa soddisfatto
            solo con un documento allegato e la pagina o clausola che lo dimostra.

          FILE
          - L'utente può allegare file direttamente nella chat (fino a 50 MB ciascuno: CSV, Excel, PDF, XML, ZIP, testo,
            immagini) e gestirli o eliminarli dal pannello Files di LibreChat, oppure depositarli nella cartella inbox di
            conformità. I documenti allegati non vengono inviati grezzi al modello ma salvati nell'area di staging:
            elencali con get_inbox_files, allegali stabilmente a prodotti/device/task in Moqui con attach_content, e
            analizzali nella sandbox skills-python con run_skill_script (moqui-compliance-intake: eplan_bom.py per la
            distinta EPLAN, pdf_pages.py per i PDF pagina per pagina) o con run_python / run_bash. Non riportare mai un
            documento intero nella conversazione: estrai solo ciò che serve.
          - Controlla il cartiglio di ogni schema: un disegno di un altro impianto è al massimo un riferimento.

          STILE
          Rispondi nella lingua dell'utente, in modo chiaro e conciso, con tabelle quando aiutano. Dichiara sempre ciò che
          non sai o non hai verificato.
      artifacts: true
      skills: true
      mcpServers:
        - moqui
        - skills-python
    - name: moqui-gpt5
      label: "Moqui"
      default: false
      description: "Moqui assistant: deployment skills and the Moqui MCP server are always on"
      preset:
        endpoint: openAI
        model: gpt-5
      artifacts: true
      skills: true
      mcpServers:
        - moqui
        - skills-python

fileConfig:
  serverFileSizeLimit: 100
  fileTokenLimit: 150000
  endpoints:
    # Pictures, text, CSV, Excel, XML, ZIP and PDF; non-image local files are stored in the staging inbox (/app/uploads)
    # and referenced by path rather than base64-encoded into LLM requests (see patch-librechat-ui.sh / BaseClient.js).
    agents:
      fileLimit: 20
      fileSizeLimit: 50
      totalSizeLimit: 200
      supportedMimeTypes:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "text/xml"
        - "application/xml"
        - "application/vnd.ms-excel"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/pdf"
        - "application/zip"
        - "application/x-zip-compressed"
    # The model spec of the deployment uses the OpenAI endpoint: the same files as for agents
    openAI:
      fileLimit: 20
      fileSizeLimit: 50
      totalSizeLimit: 200
      supportedMimeTypes:
        - "image/jpeg"
        - "image/png"
        - "image/gif"
        - "image/webp"
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "text/xml"
        - "application/xml"
        - "application/vnd.ms-excel"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/pdf"
        - "application/zip"
        - "application/x-zip-compressed"

# Local file storage (not S3/Firebase/Azure) - writes uploads to /app/uploads
# inside the container, bind-mounted to ./librechat/uploads on the host
# (librechat-compose.yml) so Moqui's cyber_attach_product_content /
# cyber_attach_product_family_content MCP tools (moqui-cybersecurity-agent
# component) can read the same file by its host path, no copy step.
# Without this, LibreChat's default upload handling for file-capable models
# can hand the file to the provider's own file API instead (observed: GPT-4.1
# expecting the file at /mnt/data, its own Code Interpreter sandbox - not
# reachable by any Moqui-side tool).
fileStrategy: "local"

webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngSearchOptions:
    engines: "google,bing,startpage,qwant"
    language: "it-IT"
    timeout: 15000
  rerankerType: "none"
  safeSearch: 1
  allowedAddresses:
    - "moqui-searxng:8080"

endpoints:
  agents:
    # No Agent Builder panel in the sidebar
    disableBuilder: true
    capabilities:
      - artifacts
      - tools
      - context
      - skills
      - web_search
  openAI:
    titleConvo: true
    titleModel: "gpt-5"
  anthropic:
    titleConvo: true
  google:
    titleConvo: true
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
        fetch: false
    - name: "Kimi"
      apiKey: "${MOONSHOT_API_KEY}"
      baseURL: "https://api.moonshot.ai/v1"
      models:
        default:
          - "moonshot-v1-8k"
          - "moonshot-v1-32k"
        fetch: false

# MCP domain allowlist — required to permit host.docker.internal (private IP).
# Without this, LibreChat's SSRF protection blocks all private-IP MCP servers.
mcpSettings:
  allowedDomains:
    # LibreChat does not interpolate arbitrary environment variables in this file.
    # Keep this origin aligned with the local Moqui test instance below.
    - "http://host.docker.internal:8080"
    # The Python server of the skills, on the internal network of python-skills-compose.yml
    - "http://moqui-python-skills:8000"

# MCP server configuration — Moqui MCP integration.
# LibreChat reaches the local test Moqui process on port 8080 through Docker's host gateway.
# Its MCP SDK currently speaks 2025-11-25; moqui-mcp enables a profile-scoped adapter.
# Authorization: the Keycloak access token of the person who is chatting (Bearer, see the header below).
mcpServers:
  moqui:
    # Connected for each person when they chat (the header names the person), not once at startup
    startup: false
    type: streamable-http
    url: "http://host.docker.internal:8080/mcp"
    headers:
      Accept: "application/json, text/event-stream"
      # The person who is chatting: the access token that Keycloak issued to LibreChat for them (OPENID_REUSE_TOKENS), which
      # Moqui MCP checks and runs the request as the Moqui user of the same username. No shared account.
      Authorization: "Bearer {{LIBRECHAT_OPENID_TOKEN}}"
      # Enables only the legacy protocol adapter; normal Moqui artifact authorization still applies.
      X-Moqui-Mcp-Profile: "librechat"
      # Do not set MCP-Protocol-Version here: LibreChat's MCP SDK already sends it,
      # and a second copy is merged into "2025-11-25, 2025-11-25", which Moqui rejects.
    timeout: 60000
    initTimeout: 30000

  # Runs the Python scripts of the skills in a container of its own (ai/python-skills-mcp), without network access.
  skills-python:
    type: streamable-http
    url: "http://moqui-python-skills:8000/mcp"
    headers:
      Accept: "application/json, text/event-stream"
    timeout: 180000
    initTimeout: 30000
    serverInstructions: "Runs the Python scripts of the skills and custom Python/Bash code in an isolated sandbox with read-only access to the staging inbox (/inbox and /uploads) and Moqui content store (/content). Use list_skill_scripts to see skill scripts, write_file to write inputs in /workspace, run_skill_script to run a skill script, run_python or run_bash for ad-hoc extraction/ETL, and read_file to read outputs."
