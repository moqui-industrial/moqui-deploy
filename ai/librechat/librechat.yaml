# LibreChat configuration for Moqui integration.
# https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/custom_config
version: 1.3.11
cache: true

# Local file storage (not S3/Firebase/Azure) - writes uploads to /app/uploads
# inside the container, bind-mounted to ./librechat/uploads on the host
# (librechat-compose.yml) so Moqui's cyber_attach_product_content /
# cyber_attach_product_family_content MCP tools (moqui-cybersecurity-agent
# component) can read the same file by its host path, no copy step.
# Without this, LibreChat's default upload handling for file-capable models
# can hand the file to the provider's own file API instead (observed: GPT-4.1
# expecting the file at /mnt/data, its own Code Interpreter sandbox - not
# reachable by any Moqui-side tool).
fileStrategy: "local"

endpoints:
  openAI:
    titleConvo: true
    titleModel: "gpt-4o-mini"
  anthropic:
    titleConvo: true
  google:
    titleConvo: true
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default:
          - "deepseek-chat"
          - "deepseek-reasoner"
        fetch: false
    - name: "Kimi"
      apiKey: "${MOONSHOT_API_KEY}"
      baseURL: "https://api.moonshot.ai/v1"
      models:
        default:
          - "moonshot-v1-8k"
          - "moonshot-v1-32k"
        fetch: false

# MCP domain allowlist — required to permit host.docker.internal (private IP).
# Without this, LibreChat's SSRF protection blocks all private-IP MCP servers.
mcpSettings:
  allowedDomains:
    # LibreChat does not interpolate arbitrary environment variables in this file.
    # Keep this origin aligned with the local Moqui test instance below.
    - "http://host.docker.internal:8080"

# MCP server configuration — Moqui MCP integration.
# LibreChat reaches the local test Moqui process on port 8080 through Docker's host gateway.
# Its MCP SDK currently speaks 2025-11-25; moqui-mcp enables a profile-scoped adapter.
# Authorization: Basic base64(john.doe:moqui) — replace with a dedicated MCP user in production.
mcpServers:
  moqui:
    type: streamable-http
    url: "http://host.docker.internal:8080/mcp"
    headers:
      Accept: "application/json, text/event-stream"
      Authorization: "Basic am9obi5kb2U6bW9xdWk="
      # Enables only the legacy protocol adapter; normal Moqui artifact authorization still applies.
      X-Moqui-Mcp-Profile: "librechat"
      # Do not set MCP-Protocol-Version here: LibreChat's MCP SDK already sends it,
      # and a second copy is merged into "2025-11-25, 2025-11-25", which Moqui rejects.
    timeout: 60000
    initTimeout: 30000
